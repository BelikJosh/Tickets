<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Tickets - Sensata Technologies</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="logo-section">
      <div class="logo-container">
        <img src="../img/logo.png" alt="Sensata Technologies Logo" class="sensata-logo">
        <h1>Praesidium</h1>
        <p>Sistema de Gestión de Tickets</p>
      </div>
    </div>

    <div class="login-container">
      <div class="login-card">
        <div class="login-header">
          <div class="ticket-icon">🎫</div>
          <h2>Iniciar Sesión</h2>
          <p>Accede a tu cuenta</p>
        </div>
        
        <form (ngSubmit)="onSubmit()" class="login-form">
          <div class="form-group">
            <label for="email">Email:</label>
            <div class="input-with-icon">
              <i class="fas fa-envelope"></i>
              <input 
                type="email" 
                id="email" 
                [(ngModel)]="email" 
                name="email" 
                required
                placeholder="ejemplo@empresa.com"
                class="form-input">
            </div>
          </div>

          <div class="form-group">
            <label for="password">Contraseña:</label>
            <div class="input-with-icon">
              <i class="fas fa-lock"></i>
              <input 
                type="password" 
                id="password" 
                [(ngModel)]="password" 
                name="password" 
                required
                placeholder="Ingresa tu contraseña"
                class="form-input">
            </div>
          </div>

          <div class="remember-forgot">
            <label class="checkbox-container">
              <input type="checkbox" id="remember">
              <span class="checkmark"></span>
              Recordarme
            </label>
            <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
          </div>

          <div *ngIf="errorMessage" class="error-message">
            ⚠️ {{errorMessage}}
          </div>

          <button type="submit" class="login-btn" [disabled]="isLoading">
            <i class="fas fa-sign-in-alt"></i> 
            {{isLoading ? '⏳ Iniciando sesión...' : 'Iniciar Sesión'}}
          </button>
        </form>

        <div class="test-credentials">
          <h4><i class="fas fa-key"></i> Credenciales de Prueba:</h4>
          <div class="credential-item">
            <strong><i class="fas fa-user"></i> Empleado:</strong> juan@empresa.com / 123456
          </div>
          <div class="credential-item">
            <strong><i class="fas fa-laptop-code"></i> IT:</strong> maria.it@empresa.com / 123456
          </div>
          <div class="credential-item">
            <strong><i class="fas fa-crown"></i> Admin:</strong> carlos.admin@empresa.com / 123456
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
